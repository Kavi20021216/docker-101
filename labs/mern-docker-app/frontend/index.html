<!DOCTYPE html>
<html>

<head>
  <title>MERN App</title>
</head>

<body>
  <h1>My MERN Docker App 🚀</h1> <button onclick="loadData()">Call Backend</button>
  <p id="result"></p>
  <script> function loadData() { fetch("http://localhost:5000").then(res => res.text()).then(data => { document.getElementById("result").innerText = data; }); } </script>
</body>

</html>
